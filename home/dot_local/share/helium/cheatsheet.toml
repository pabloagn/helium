# Helium keyboard shortcuts -- human-facing reference
#
# Keep this synchronized with OmniWM and Karabiner, then run `just apply`.
# A chezmoi run_onchange script regenerates
# ~/.local/state/helium/cheatsheet.json, which the "Helium Shortcuts" Raycast
# extension reads. Do not edit the generated JSON.
#
# Shape: one [[group]] per section, each with a name, an optional note, and a
# list of binds. Each bind is { keys = "...", action = "..." }.

[meta]
title = "Helium Shortcuts"
hyper = "Caps Lock held (or Right Command) = Hyper; tapped Caps Lock = Escape. Caps + arrows focuses; Caps + physical Shift + arrows moves the window."

[[group]]
name = "Workspaces"
note = "Numbers are pinned to physical displays by stable display UUID."
binds = [
  { keys = "Hyper 1..9", action = "Focus workspace" },
  { keys = "Opt+Shift 1..9", action = "Send window there without following" },
  { keys = "Hyper [ / ]", action = "Previous / next workspace on this display" },
  { keys = "Ctrl+Opt+Shift S / A", action = "Move window up / down, into the next workspace at the edge" },
  { keys = "Hyper Tab", action = "Previous workspace" },
  { keys = "Opt+Shift Tab", action = "Previously focused window" },
]

[[group]]
name = "Displays"
note = "Which workspace lives on which screen."
binds = [
  { keys = "1", action = "Laptop (left)" },
  { keys = "2..8", action = "MAG ultrawide (center)" },
  { keys = "9", action = "Dell portrait (right)" },
]

[[group]]
name = "Finding things"
note = ""
binds = [
  { keys = "Hyper Space", action = "OmniWM command palette: windows and app menus" },
  { keys = "Hyper X", action = "Overview: live windows across workspaces and displays" },
]

[[group]]
name = "Focus and windows"
note = ""
binds = [
  { keys = "Caps Lock + arrows", action = "Focus left / down / up / right" },
  { keys = "Caps Lock + Shift + ← / →", action = "Shift the column left / right, like Niri (no accidental stacking)" },
  { keys = "Caps Lock + Shift + ↑ / ↓", action = "Move the window up / down within its column" },
  { keys = "Hyper , / .", action = "Focus previous / next display" },
  { keys = "Opt+Shift , / .", action = "Move window to display and follow" },
  { keys = "Hyper C", action = "Close window" },
  { keys = "Hyper F", action = "Toggle column 50% / 100% width" },
  { keys = "Opt+Shift F", action = "Native macOS fullscreen" },
  { keys = "Hyper V", action = "Toggle floating / tiling" },
]

[[group]]
name = "Layout"
note = ""
binds = [
  { keys = "Opt+Shift V", action = "Consume window into the neighboring Niri column" },
  { keys = "Opt+Shift Z", action = "Toggle the focused Niri column tabbed" },
  { keys = "Hyper - / =", action = "Decrease / increase container width by 10%" },
  { keys = "Opt+Shift - / =", action = "Decrease / increase window height by 10%" },
  { keys = "Hyper R", action = "Cycle 33% / 50% / 67% / 100% container widths" },
  { keys = "Opt+Shift R", action = "Balance sizes" },
  { keys = "Opt+Shift Scroll", action = "Scroll through Niri columns (wheel or 3-finger trackpad swipe)" },
]

[[group]]
name = "Launchers"
note = ""
binds = [
  { keys = "Hyper A", action = "Raycast (also Hyper 0; Raycast's own hotkeys)" },
  { keys = "Hyper Enter", action = "Ghostty" },
  { keys = "Hyper W", action = "Ghostty in a new column beside the focused window" },
  { keys = "Opt+Shift W", action = "Ghostty stacked in the focused column" },
  { keys = "Hyper B / Hyper Z", action = "Firefox Personal / AtmosphericAI" },
  { keys = "Opt+Shift B", action = "Safari" },
  { keys = "Hyper D", action = "Yazi in Ghostty" },
  { keys = "Hyper E / Opt+Shift E", action = "Neovim in Ghostty / Zed" },
  { keys = "Hyper I / Opt+Shift I", action = "VS Code / Cursor" },
  { keys = "Opt+Shift A", action = "ChatGPT" },
  { keys = "Hyper N / Opt+Shift N", action = "Notion / Linear" },
  { keys = "Hyper M / Opt+Shift M", action = "Slack / WhatsApp" },
  { keys = "Hyper T / Opt+Shift T", action = "Teams / Zoom" },
  { keys = "Hyper G", action = "Spotify" },
  { keys = "Hyper P", action = "1Password" },
  { keys = "Hyper O", action = "Downloads" },
  { keys = "Hyper Q", action = "Calculator" },
]

[[group]]
name = "Screenshots"
note = ""
binds = [
  { keys = "Hyper S", action = "Whole screen to a file" },
  { keys = "Opt+Shift S", action = "Region to the clipboard (also Print Screen)" },
  { keys = "Hyper Y", action = "Window to a file" },
]

[[group]]
name = "System"
note = ""
binds = [
  { keys = "Hyper Escape", action = "Sleep the display" },
]
