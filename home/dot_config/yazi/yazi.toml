# Ported from the Rhodium (NixOS) Yazi configuration, adapted to macOS:
# openers go through `open`, previews use Preview.app and Finder, and the
# Wayland/X11-only pieces (wl-clipboard, dragon-drop, thunar, imv, oculante,
# swayimg, okular, zathura, LibreOffice, the mount plugin) are dropped.

[mgr]
ratio = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
sort_fallback = "alphabetical"
linemode = "size_and_mtime"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll", "touch", "move", "drag"]

[preview]
wrap = "no"
tab_size = 2
max_width = 2000
max_height = 1200
image_filter = "nearest"
image_quality = 75
image_delay = 20

# Yazi 26 renamed these. Rhodium set `micro_workers` / `macro_workers`, which
# no longer exist and were being ignored outright -- the parallelism it asked
# for was never applied. These are the current names.
[tasks]
file_workers = 5
plugin_workers = 10
fetch_workers = 10
preload_workers = 5
process_workers = 10
bizarre_retry = 5
image_alloc = 536870912
image_bound = [10000, 10000]
suppress_preload = false

# Dialog placement, ported from Rhodium. Note Yazi 26 moved the destructive
# prompts out of [input] into [confirm]; keeping them under [input], as Rhodium
# had them, would have been silently dropped.
[input]
cursor_blink = false
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
trash_title = "Move {n} selected file{s} to trash?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]
delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]
overwrite_title = "Overwrite file?"
overwrite_body = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]
quit_title = "Quit?"
quit_body = "{n} task{s} still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

# Rhodium called this [select]; Yazi 26 renamed it to [pick]. This is the
# "Open with:" chooser that Shift+O brings up.
[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 12]

[which]
sort_by = "none"
sort_reverse = false
sort_sensitive = false
sort_translit = false

[log]
enabled = false

[opener]
# Terminal editors block Yazi while they run; GUI editors are orphaned so Yazi
# stays usable. None of the GUI editors ship a CLI on PATH here, so each goes
# through `open -a`.
#
# %s is the file-list placeholder and %s1 is the first file. These are the
# Yazi 26 forms. The old shell forms "$@" and "$1" stopped being substituted in
# Yazi 26.8: every opener still ran, but with no file arguments, which is how
# Enter on a file started opening a bare $EDITOR at the dashboard.
edit = [
  { run = '${EDITOR:-nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
]
edit-helix = [
  { run = 'hx %s', desc = "Helix", block = true, for = "unix" },
]
edit-vim = [
  { run = 'vim %s', desc = "Vim", block = true, for = "unix" },
]
edit-nano = [
  { run = 'nano %s', desc = "Nano", block = true, for = "unix" },
]
edit-zed = [
  { run = 'open -a Zed %s', desc = "Zed", orphan = true, for = "macos" },
]
edit-code = [
  { run = 'open -a "Visual Studio Code" %s', desc = "VS Code", orphan = true, for = "macos" },
]
edit-cursor = [
  { run = 'open -a Cursor %s', desc = "Cursor", orphan = true, for = "macos" },
]
edit-pycharm = [
  { run = 'open -a PyCharm %s', desc = "PyCharm", orphan = true, for = "macos" },
]
open = [
  { run = 'open %s', desc = "System default", orphan = true, for = "macos" },
]
preview = [
  { run = 'open -a Preview %s', desc = "Preview", orphan = true, for = "macos" },
]
reveal = [
  { run = 'open -R %s1', desc = "Reveal in Finder", orphan = true, for = "macos" },
]
browser-personal = [
  { run = '"$HOME/.local/bin/ff-personal" %s', desc = "Firefox (Personal)", orphan = true, for = "macos" },
]
browser-atmospheric = [
  { run = '"$HOME/.local/bin/ff-atmospheric" %s', desc = "Firefox (AtmosphericAI)", orphan = true, for = "macos" },
]
browser-private = [
  { run = '"$HOME/.local/bin/ff-private" %s', desc = "Firefox (Private)", orphan = true, for = "macos" },
]
safari = [
  { run = 'open -a Safari %s', desc = "Safari", orphan = true, for = "macos" },
]
extract = [
  { run = 'ouch decompress -- %s', desc = "Extract here", for = "unix" },
]
# `prepend_rules` keeps Yazi's own defaults as a final fallback. Every code and
# text rule offers the full editor chain, so Shift+O (open --interactive) lists
# all of them rather than just $EDITOR -- this mirrors Rhodium, which put
# edit/helix/zed/nano/emacs on every such rule.
[open]
prepend_rules = [
  # Directories: open the folder as a project.
  { url = "*/", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },

  # Code and configuration
  { url = "*.{js,jsx,ts,tsx,mjs,cjs,py,rs,go,c,cpp,h,hpp,java,kt,rb,php,lua,vim,sh,bash,zsh,fish,nu,ps1,swift,scala,clj,ex,exs,erl,hs,ml,jl,r,R,sql,graphql,proto,tf,nix,dockerfile}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },
  { url = "*.{json,jsonc,json5,yaml,yml,toml,ini,conf,cfg,env,properties,plist}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },
  { url = "*.{css,scss,sass,less,styl}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },
  { url = "*.{md,markdown,rst,tex,typ,org,adoc,txt,text,log}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },
  { url = "*.{xml,xsl,xsd,csv,tsv,parquet,xlsx}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },

  # Python gets PyCharm as an extra option.
  { url = "*.py", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "edit-pycharm", "open", "reveal"] },

  # HTML is both markup and something to render.
  { url = "*.{html,htm,xhtml}", use = ["browser-personal", "browser-atmospheric", "browser-private", "safari", "edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "reveal"] },

  # SVG is both an image and code.
  { url = "*.svg", use = ["open", "preview", "edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "reveal"] },

  # Media and documents: viewers first, editors still reachable.
  { url = "*.{jpg,jpeg,png,gif,webp,bmp,ico,tiff,avif,heic,heif}", use = ["open", "preview", "reveal"] },
  { url = "*.pdf", use = ["open", "preview", "browser-personal", "browser-atmospheric", "browser-private", "safari", "reveal"] },
  { mime = "image/*", use = ["open", "preview", "reveal"] },
  { mime = "{audio,video}/*", use = ["open", "reveal"] },

  # Archives
  { mime = "application/{,g}zip", use = ["extract", "open", "reveal"] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = ["extract", "open", "reveal"] },

  # Office
  { url = "*.{doc,docx,odt,rtf,xls,xlsm,ods,ppt,pptx,odp}", use = ["open", "reveal"] },

  # Anything textual, and empty files, still get the full editor chain.
  { mime = "text/*", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "open", "reveal"] },
  { mime = "application/{json,x-ndjson}", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "browser-personal", "browser-atmospheric", "browser-private", "safari", "reveal"] },
  { mime = "inode/empty", use = ["edit", "edit-helix", "edit-zed", "edit-code", "edit-cursor", "edit-vim", "edit-nano", "reveal"] },
]

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
# duckdb's own extension map is: csv, tsv, txt, json, parquet, xlsx, db,
# duckdb. Anything outside it makes the plugin bail with "File is not a
# supported file type", so only those are wired here. `.txt` and `.json` are
# left to Yazi's built-in previewers, which are better for prose and for config
# files -- duckdb would try to read them as tables.
prepend_preloaders = [
  { url = "*.{csv,tsv,parquet,xlsx}", run = "duckdb", multi = false },
]
prepend_previewers = [
  { url = "*.{csv,tsv,parquet,xlsx,db,duckdb}", run = "duckdb" },
  # Markdown goes through piper, not the glow.yazi plugin: that plugin is
  # deprecated upstream in favour of piper and calls Command:args(), which Yazi
  # 26 renamed to :arg() -- every peek raised "attempt to call a nil value".
  #
  # Three details are load-bearing:
  #   * -s points at the kanso glow stylesheet, so previews match every other
  #     theme on this machine rather than glow's generic "dark".
  #   * CLICOLOR_FORCE makes glow emit colour even though stdout is a pipe.
  #   * </dev/null is required. glow 3.0 blocks forever reading inherited stdin,
  #     which hangs the whole preview pane.
  { url = "*.{md,markdown}", run = 'piper -- CLICOLOR_FORCE=1 glow -s="$HOME/.config/glow/kanso.json" -w=$w "$1" </dev/null' },
  { mime = "application/{,g}zip", run = "ouch" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", run = "ouch" },
]
