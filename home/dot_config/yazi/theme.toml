# Kanso, ported from the Rhodium (NixOS) Yazi theme.
#
# The important part is [filetype] at the bottom: without those rules every
# entry renders in the same foreground colour, which is what made this look
# flat compared to Rhodium.

[mgr]
cwd = { fg = "#E6C384" }

marker_copied = { fg = "#87A987", bg = "#87A987" }
marker_cut = { fg = "#E46876", bg = "#E46876" }
marker_marked = { fg = "#938AA9", bg = "#938AA9" }
marker_selected = { fg = "#B98D7B", bg = "#B98D7B" }

count_copied = { fg = "#090E13", bg = "#87A987" }
count_cut = { fg = "#090E13", bg = "#E46876" }
count_selected = { fg = "#090E13", bg = "#E6C384" }

find_keyword = { fg = "#B98D7B", bg = "#090E13" }
find_position = {}

symlink_target = { fg = "#6B7E84", italic = true }
marker_symbol = "▍"

border_symbol = "│"
border_style = { fg = "#C5C9C7" }

[tabs]
active = { fg = "#090E13", bg = "#C5C9C7", bold = true }
inactive = { fg = "#6B7E84", bg = "#090E13" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#090E13", bg = "#8BA4B0" }
normal_alt = { fg = "#8BA4B0", bg = "#090E13" }
select_main = { fg = "#090E13", bg = "#957FB8" }
select_alt = { fg = "#957FB8", bg = "#090E13" }
unset_main = { fg = "#090E13", bg = "#E6C384" }
unset_alt = { fg = "#E6C384", bg = "#090E13" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#C5C9C7", bg = "#090E13" }
progress_label = { fg = "#8BA4B0", bg = "#090E13", bold = true }
progress_normal = { fg = "#090E13", bg = "#090E13" }
progress_error = { fg = "#090E13", bg = "#090E13" }
perm_type = { fg = "#87A987" }
perm_read = { fg = "#E6C384" }
perm_write = { fg = "#E46876" }
perm_exec = { fg = "#7AA89F" }
perm_sep = { fg = "#938AA9" }

[pick]
border = { fg = "#7FB4CA" }
active = { fg = "#938AA9", bold = true }
inactive = {}

[input]
border = { fg = "#7FB4CA" }
title = {}
value = {}
selected = { reversed = true }

[tasks]
border = { fg = "#7FB4CA" }
title = {}
hovered = { fg = "#938AA9" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#A4A7A4" }
mask = { bg = "#090E13" }
rest = { fg = "#A4A7A4" }
cand = { fg = "#8EA4A2" }
desc = { fg = "#C5C9C7" }

[help]
on = { fg = "#7AA89F" }
run = { fg = "#938AA9" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#090E13", bg = "#C5C9C7" }

[notify]
title_info = { fg = "#87A987" }
title_warn = { fg = "#E6C384" }
title_error = { fg = "#E46876" }

[indicator]
padding = { open = "█", close = "█" }
parent = { reversed = true }
current = { reversed = true }
preview = { reversed = true }

[confirm]
border = { fg = "#7FB4CA" }
title = { fg = "#E6C384" }
body = {}
list = { fg = "#8EA4A2" }
btn_yes = { fg = "#090E13", bg = "#87A987", bold = true }
btn_no = { fg = "#090E13", bg = "#E46876", bold = true }
btn_labels = ["  [Y]es  ", "  (N)o  "]

[spot]
border = { fg = "#7FB4CA" }
title = { fg = "#E6C384" }
tbl_col = { fg = "#8BA4B0", bold = true }
tbl_cell = { fg = "#0D0C0C", bg = "#E6C384" }

[filetype]
rules = [
  # images
  { mime = "image/*", fg = "#E6C384" },
  # media
  { mime = "{audio,video}/*", fg = "#938AA9" },
  # archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E46876" },
  # documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#A292A3" },
  # broken links
  { url = "*", is = "orphan", fg = "#E46876" },
  # executables
  { url = "*", is = "exec", fg = "#7AA89F" },
  # fallback
  { url = "*", fg = "#C5C9C7" },
  { url = "*/", fg = "#8BA4B0" },
]
