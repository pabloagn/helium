# --- Flattened default styles ---
# Starship's defaults use bold liberally. Everything that can render keeps its
# hue but loses the bold, matching the rest of this config. Deliberately kept
# bold because the state merits emphasis: username.style_root (prompt as
# root), golang/nodejs not_capable_style (toolchain version warnings).
[claude_model]
style = "blue"

[fortran]
style = "purple"

[maven]
