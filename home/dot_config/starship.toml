# Ported from Rhodium (NixOS), byte-exact via script, matching its default.nix imports:
#   home/apps/terminals/prompts/starship/{core,custom-rhodium,format}.nix
#   (custom-langs.nix is commented out on Rhodium, so it is not ported)
# [custom.times] needs STARSHIP_CUSTOM_START/END, set by the shell timer hooks
# (fish: functions/__starship_*_timer.fish; zsh: ~/.zshrc). Both need gdate (coreutils).

format = """
$username$hostname($shlvl)($cmd_duration)(${custom.times})
$directory($git_branch$git_commit$git_state$git_status$git_metrics)$all $fill ($nix_shell)
$jobs$character"""
scan_timeout = 100
command_timeout = 1000

[fill]
symbol = " "

[custom.times]
description = "Display Execution Times (Start and End Time)"
command = "echo $STARSHIP_CUSTOM_START $STARSHIP_CUSTOM_END"
format = "[$output]($style)"
style = "#6F685D"
when = true

[custom.rhodium]
disabled = true
command = "echo 'Rh'"
when = "true"
format = "[$output]($style) ◆ "
style = "#A4A7A4"

[username]
format = "[$user]($style)"
show_always = true
style_user = "#4a7fff"

[hostname]
format = "[@$hostname]($style) "
style = "#4B5F6F"
ssh_only = false
ssh_symbol = "󰒋 "

[shlvl]
disabled = false
format = "[$shlvl]($style) "
repeat = true
style = "#59bfaa"
symbol = "T"
# Rhodium uses 3 to absorb the extra shell level niri creates; macOS has no niri.
threshold = 2

[cmd_duration]
format = "⑄ [$duration]($style) "
style = "#928A7C"

[directory]
fish_style_pwd_dir_length = 1
format = "[$path]($style) "
read_only = "⌽ "
style = "#4a7fff"
truncate_to_repo = true
truncation_length = 3

[nix_shell]
format = "[($name <- )$symbol]($style) "
impure_msg = "impure"
style = "#c4746e"
symbol = " "
pure_msg = "pure"
unknown_msg = ""
disabled = false
heuristic = false

[character]
error_symbol = "[->>](#E46876)"
success_symbol = "[->>](#445564)"
vimcmd_replace_one_symbol = "[<<-](#5a5c8a)"
vimcmd_replace_symbol = "[<<-](#5a5c8a)"
vimcmd_symbol = "[<<-](#d4bf94)"
vimcmd_visual_symbol = "[<<-](#59bfaa)"

[time]
format = '\[[$time]($style)\]'
style = "#4B5F6F"
disabled = true

# The native aws module cannot be gated: it fires off ~/.aws/config's default
# region, so it showed in every directory. It is replaced by [custom.aws]
# below, which appears only when an AWS env var is set (e.g. per-project via
# a direnv .envrc), never from the config file alone.
[aws]
disabled = true

[custom.aws]
description = "AWS profile and region, only when set in the environment"
when = 'test -n "${AWS_PROFILE}${AWS_VAULT}${AWS_REGION}${AWS_DEFAULT_REGION}"'
command = 'printf "%s" "$AWS_PROFILE${AWS_PROFILE:+ }"; r="${AWS_REGION:-$AWS_DEFAULT_REGION}"; [ -n "$r" ] && printf "(%s)" "$r"'
symbol = " "
format = "[◆](#4B5F6F) [$symbol$output]($style) "
style = "#c4b28a"

