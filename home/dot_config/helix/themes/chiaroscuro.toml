# Chiaroscuro, ported from Rhodium's Helix theme module.
#
# Scope names such as "ui.background" and "comment.block.documentation" are
# single literal keys with dots in them, NOT nested tables. An earlier
# conversion split them into [ui.background]-style tables, which Helix rejected
# with "Failed to parse style for key "ui". Invalid style attribute:
# background" -- so the theme silently did not apply at all.

attribute = { fg = "#7dcfff" }
comment = { fg = "#565f89", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "#e0af68" }
constant = { fg = "#ff9e64" }
"constant.builtin" = { fg = "#2ac3de" }
"constant.character" = { fg = "#9ece6a" }
"constant.character.escape" = { fg = "#bb9af7" }
constructor = { fg = "#2ac3de" }
function = { fg = "#7aa2f7", modifiers = ["italic"] }
"function.builtin" = { fg = "#2ac3de" }
"function.macro" = { fg = "#7dcfff" }
"function.special" = { fg = "#7dcfff" }
keyword = { fg = "#9d7cd8", modifiers = ["italic"] }
"keyword.control" = { fg = "#bb9af7" }
"keyword.control.import" = { fg = "#7dcfff" }
"keyword.control.return" = { fg = "#9d7cd8", modifiers = ["italic"] }
"keyword.directive" = { fg = "#7dcfff" }
"keyword.function" = { fg = "#bb9af7" }
"keyword.operator" = { fg = "#bb9af7" }
label = { fg = "#7aa2f7" }
namespace = { fg = "#7dcfff" }
operator = { fg = "#89ddff" }
punctuation = { fg = "#89ddff" }
special = { fg = "#2ac3de" }
string = { fg = "#9ece6a" }
"string.regexp" = { fg = "#b4f9f8" }
"string.special" = { fg = "#2ac3de" }
tag = { fg = "#bb9af7" }
type = { fg = "#2ac3de" }
"type.builtin" = { fg = "#2ac3de" }
"type.enum.variant" = { fg = "#ff9e64" }
variable = { fg = "#c0caf5" }
"variable.builtin" = { fg = "#f7768e" }
"variable.other.member" = { fg = "#73daca" }
"variable.parameter" = { fg = "#e0af68", modifiers = ["italic"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.heading" = { fg = "#7aa2f7", modifiers = ["bold"] }
"markup.heading.completion" = { bg = "#16161e", fg = "#c0caf5" }
"markup.heading.hover" = { bg = "#343a55" }
