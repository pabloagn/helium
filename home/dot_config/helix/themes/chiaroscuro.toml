# Chiaroscuro, ported verbatim from Rhodium's Helix theme module.

attribute = { fg = "#7dcfff" }
constructor = { fg = "#2ac3de" }
label = { fg = "#7aa2f7" }
namespace = { fg = "#7dcfff" }
operator = { fg = "#89ddff" }
punctuation = { fg = "#89ddff" }
special = { fg = "#2ac3de" }
tag = { fg = "#bb9af7" }
error = { fg = "#db4b4b" }
warning = { fg = "#e0af68" }
info = { fg = "#0db9d7" }
hint = { fg = "#1abc9c" }

[comment]
fg = "#565f89"
modifiers = ["italic"]

[comment.block]
documentation = { fg = "#e0af68" }

[constant]
fg = "#ff9e64"
builtin = { fg = "#2ac3de" }

[constant.character]
fg = "#9ece6a"
escape = { fg = "#bb9af7" }

[function]
fg = "#7aa2f7"
modifiers = ["italic"]
builtin = { fg = "#2ac3de" }
macro = { fg = "#7dcfff" }
special = { fg = "#7dcfff" }

[keyword]
fg = "#9d7cd8"
modifiers = ["italic"]
directive = { fg = "#7dcfff" }
function = { fg = "#bb9af7" }
operator = { fg = "#bb9af7" }

[keyword.control]
fg = "#bb9af7"
import = { fg = "#7dcfff" }
return = { fg = "#9d7cd8", modifiers = ["italic"] }

[string]
fg = "#9ece6a"
regexp = { fg = "#b4f9f8" }
special = { fg = "#2ac3de" }

[type]
fg = "#2ac3de"
builtin = { fg = "#2ac3de" }

[type.enum]
variant = { fg = "#ff9e64" }

[variable]
fg = "#c0caf5"
builtin = { fg = "#f7768e" }
parameter = { fg = "#e0af68", modifiers = ["italic"] }

[variable.other]
member = { fg = "#73daca" }

[markup]
bold = { modifiers = ["bold"] }
italic = { modifiers = ["italic"] }
list = { fg = "#ff9e64", modifiers = ["bold"] }
strikethrough = { modifiers = ["crossed_out"] }

[markup.heading]
fg = "#7aa2f7"
modifiers = ["bold"]
completion = { bg = "#16161e", fg = "#c0caf5" }
hover = { bg = "#343a55" }

[markup.link]
fg = "#7aa2f7"
underline = { style = "line" }
label = { fg = "#1abc9c" }
text = { fg = "#1abc9c" }

[markup.link.url]
underline = { style = "line" }

[markup.normal]
completion = { fg = "#565f89" }
hover = { fg = "#a9b1d6" }

[markup.raw]
fg = "#1abc9c"
inline = { bg = "#414868", fg = "#7aa2f7" }

[diff]
minus = { fg = "#914c54" }
plus = { fg = "#449dab" }

[diff.delta]
fg = "#6183bb"
moved = { fg = "#7aa2f7" }

[diagnostic]
unnecessary = { modifiers = ["dim"] }
deprecated = { modifiers = ["crossed_out"] }

[diagnostic.error]
underline = { style = "curl", color = "#db4b4b" }
gutter = { fg = "#db4b4b" }

[diagnostic.warning]
underline = { style = "curl", color = "#e0af68" }
gutter = { fg = "#e0af68" }

[diagnostic.info]
underline = { style = "curl", color = "#0db9d7" }
gutter = { fg = "#0db9d7" }

[diagnostic.hint]
underline = { style = "curl", color = "#1abc9c" }
gutter = { fg = "#1abc9c" }

[ui]
background = { fg = "#c0caf5" }
help = { bg = "#16161e", fg = "#c0caf5" }
popup = { bg = "#16161e", fg = "#27a1b9" }
window = { fg = "#15161e", modifiers = ["bold"] }
highlight = { bg = "#283457" }

[ui.cursor]
modifiers = ["reversed"]
match = { fg = "#ff9e64", modifiers = ["bold"] }

[ui.cursorline]
primary = { bg = "#16161e" }

[ui.linenr]
fg = "#3b4261"
selected = { fg = "#737aa2" }

[ui.menu]
bg = "#16161e"
fg = "#c0caf5"
selected = { bg = "#343a55" }

[ui.selection]
bg = "#283457"
primary = { bg = "#283457" }

[ui.statusline]
bg = "#16161e"
fg = "#a9b1d6"
inactive = { bg = "#16161e", fg = "#3b4261" }
normal = { bg = "#7aa2f7", fg = "#1a1b26", modifiers = ["bold"] }
insert = { bg = "#9ece6a", fg = "#1a1b26", modifiers = ["bold"] }
select = { bg = "#bb9af7", fg = "#1a1b26", modifiers = ["bold"] }
separator = { fg = "#3b4261" }

[ui.text]
fg = "#c0caf5"
focus = { bg = "#292e42" }
inactive = { fg = "#565f89", modifiers = ["italic"] }
info = { bg = "#16161e", fg = "#c0caf5" }
directory = { fg = "#7dcfff" }

[ui.virtual]
ruler = { bg = "#3b4261" }
whitespace = { fg = "#3b4261" }
inlay-hint = { bg = "#1a2b32", fg = "#1abc9c" }
jump-label = { fg = "#ff9e64", modifiers = ["bold"] }
indent-guide = { fg = "#3b4261" }
wrap = { fg = "#3b4261" }

[ui.bufferline]
bg = "#1a1b26"
fg = "#565f89"
active = { bg = "#16161e", fg = "#c0caf5", modifiers = ["bold"] }
background = { bg = "#1a1b26" }

[ui.picker]
header = { fg = "#7aa2f7", modifiers = ["bold"] }

[ui.cursorcolumn]
primary = { bg = "#16161e" }

