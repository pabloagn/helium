"markup.normal.completion" = { fg = "#565f89" }
"markup.normal.hover" = { fg = "#a9b1d6" }
"markup.raw" = { fg = "#1abc9c" }
"markup.raw.inline" = { bg = "#414868", fg = "#7aa2f7" }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
