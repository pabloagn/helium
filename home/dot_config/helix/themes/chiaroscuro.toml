"ui.highlight" = { bg = "#283457" }
"ui.picker.header" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "#3b4261" }
"ui.cursorcolumn.primary" = { bg = "#16161e" }
"diagnostic.error.gutter" = { fg = "#db4b4b" }
"diagnostic.warning.gutter" = { fg = "#e0af68" }
"diagnostic.info.gutter" = { fg = "#0db9d7" }
