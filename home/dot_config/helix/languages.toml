# Ported verbatim from Rhodium's Helix languages module: 55 language servers
# and 58 language definitions.
#
# Most of these server binaries were installed by Nix on Rhodium and are absent
# here. That is safe: Helix only starts a server when you open a matching file,
# and simply logs a warning if the binary is missing. Install any you want with
# Homebrew and it starts working with no config change.

[language-server]
bash-language-server = { command = "bash-language-server", args = ["start"] }
clangd = { command = "clangd" }
omnisharp = { command = "omnisharp", args = ["-lsp"] }
clojure-lsp = { command = "clojure-lsp" }
cmake-language-server = { command = "cmake-language-server" }
crystalline = { command = "crystalline" }
serve-d = { command = "serve-d" }
dhall-lsp-server = { command = "dhall-lsp-server" }
docker-langserver = { command = "docker-langserver", args = ["--stdio"] }
elixir-ls = { command = "elixir-ls" }
elm-language-server = { command = "elm-language-server" }
emmet-lsp = { command = "emmet-language-server", args = ["--stdio"] }
fish-lsp = { command = "fish-lsp", args = ["start"] }
fortls = { command = "fortls" }
fsautocomplete = { command = "fsautocomplete", args = ["--adaptive-lsp-server-enabled"] }
gleam = { command = "gleam", args = ["lsp"] }
graphql-language-service = { command = "graphql-lsp", args = ["server", "-m", "stream"] }
haskell-language-server = { command = "haskell-language-server-wrapper", args = ["--lsp"] }
jdtls = { command = "jdtls" }
jinja-lsp = { command = "jinja-lsp" }
julia-lsp = { command = "julia", args = ["--startup-file=no", "--history-file=no", "-e", "using LanguageServer; runserver()"] }
kotlin-language-server = { command = "kotlin-language-server" }
texlab = { command = "texlab" }
lua-language-server = { command = "lua-language-server" }
marksman = { command = "marksman", args = ["server"] }
nixd = { command = "nixd" }
nushell = { command = "nu", args = ["--lsp"] }
ocamllsp = { command = "ocamllsp" }
ols = { command = "ols" }
perlnavigator = { command = "perlnavigator", args = ["--stdio"] }
intelephense = { command = "intelephense", args = ["--stdio"] }
prisma-language-server = { command = "prisma-language-server", args = ["--stdio"] }
bufls = { command = "buf", args = ["beta", "lsp"] }
ruff = { command = "ruff", args = ["server"] }
r-language-server = { command = "R", args = ["--slave", "-e", "languageserver::run()"] }
rust-analyzer = { command = "rust-analyzer" }
metals = { command = "metals" }
sqls = { command = "sqls" }
svelteserver = { command = "svelteserver", args = ["--stdio"] }
sourcekit-lsp = { command = "sourcekit-lsp" }
tailwindcss-ls = { command = "tailwindcss-language-server", args = ["--stdio"] }
terraform-ls = { command = "terraform-ls", args = ["serve"] }
taplo = { command = "taplo", args = ["lsp", "stdio"] }
tinymist = { command = "tinymist" }
typescript-language-server = { command = "typescript-language-server", args = ["--stdio"] }
vue-language-server = { command = "vue-language-server", args = ["--stdio"] }
lemminx = { command = "lemminx" }
zls = { command = "zls" }

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]
config = { provideFormatter = true }

[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
hints = { assignVariableTypes = true, compositeLiteralFields = true, compositeLiteralTypes = true, constantValues = true, functionTypeParameters = true, parameterNames = true, rangeVariableTypes = true }

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]
config = { provideFormatter = true }

[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.vscode-json-language-server.config]
provideFormatter = true

[language-server.vscode-json-language-server.config.json]
validate = { enable = true }

[language-server.nil]
command = "nil"

[language-server.nil.config]

[language-server.nil.config.nil]
formatting = { command = ["nixfmt"] }

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]

[language-server.pyright.config.python]
analysis = { typeCheckingMode = "basic", autoImportCompletions = true }

[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.yaml-language-server.config]
yaml = { validate = true, completion = true }

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
auto-format = true
formatter = { command = "shfmt" }

