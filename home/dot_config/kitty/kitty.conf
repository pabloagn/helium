# Ported from Rhodium's home/apps/terminals/emulators/kitty/, then aligned with
# this machine's Ghostty config so the two terminals look and behave the same.
#
# Differences from Rhodium, all forced by macOS:
#   - font family names differ (see below)
#   - symbol_map points at JetBrains Mono, because no standalone
#     "Symbols Nerd Font Mono" is installed here
#   - open_url_with calls ff-personal instead of `firefox -p Personal`
#   - the keybinds use cmd, not ctrl+shift

# --- Font ---
# Same pair and same order as Ghostty. Berkeley Mono Rh is the text face.
# It names its slanted cuts "Oblique", not "Italic", so each style is spelled
# out; `auto` would find nothing and fall back to a synthesised slant.
font_family      family="Berkeley Mono Rh"
bold_font        family="Berkeley Mono Rh" style="Bold"
italic_font      family="Berkeley Mono Rh" style="Oblique"
bold_italic_font family="Berkeley Mono Rh" style="Bold Oblique"
font_size 14.0

# Berkeley Mono Rh ships Powerline and box-drawing glyphs but none of the Nerd
# Font icon ranges. Without this line every Yazi, eza and starship icon is an
# empty box. Rhodium mapped these to Symbols Nerd Font Mono; that face is not
# installed here, so they go to JetBrains Mono, which is what Ghostty falls
# back to as well.
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B5,U+E700-U+E7C5,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

disable_ligatures never

# --- Window ---
# Four values are top, right, bottom, left. kitty puts extra space at the top,
# so the top value is smaller to make the visible padding even.
window_padding_width 10 15 15 15
window_border_width 3pt
window_margin_width 0
hide_window_decorations titlebar-only
confirm_os_window_close 0
remember_window_size yes

# Matches Ghostty's background-opacity 0.92 and background-blur-radius 20.
background_opacity 0.92
background_blur 20

# --- macOS ---
# Option sends Alt, so Meta bindings reach the shell. Ghostty sets the same
# thing through macos-option-as-alt.
macos_option_as_alt yes
macos_quit_when_last_window_closed no
macos_show_window_title_in window

# --- Tab bar ---
tab_bar_min_tabs 2
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0
mouse_hide_wait 3.0

# --- Scrollback ---
# Rhodium used 10000. Ghostty on this machine holds a whole session, so kitty
# gets the same order of magnitude. kitty counts lines, not bytes.
scrollback_lines 100000

# --- Behaviour ---
enable_audio_bell no
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
strip_trailing_spaces smart
allow_hyperlinks yes
allow_remote_control yes
shell_integration enabled

# Links open in the Personal Firefox profile, through the same wrapper Yazi and
# the Raycast scripts use. Rhodium called `firefox -p Personal` directly, which
# has no macOS equivalent.
open_url_with ~/.local/bin/ff-personal

# --- Layouts and keys ---
# splits is listed first so it is the layout a new window starts in. The four
# binds below mirror Ghostty's.
enabled_layouts splits,stack
map cmd+shift+enter launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+shift+w     close_window
map cmd+k           clear_terminal scrollback active

# --- Theme: Kanso Zen ---
# The same palette as Ghostty's `theme = Kanso Zen` and Rhodium's
# kitty/themes/kanso.nix, copied value for value.
foreground           #C5C9C7
background           #090E13
selection_foreground #C5C9C7
selection_background #393B44
url_color            #72A7BC
cursor               #C5C9C7
cursor_text_color    #090E13

active_tab_background   #090E13
active_tab_foreground   #C5C9C7
inactive_tab_background #090E13
inactive_tab_foreground #A4A7A4

# Normal
color0  #0d0c0c
color1  #c4746e
color2  #8a9a7b
color3  #c4b28a
color4  #8ba4b0
color5  #a292a3
color6  #8ea4a2
color7  #C8C093
# Bright
color8  #A4A7A4
color9  #E46876
color10 #87a987
color11 #E6C384
color12 #7FB4CA
color13 #938AA9
color14 #7AA89F
color15 #C5C9C7
# Extended
color16 #b6927b
color17 #b98d7b
